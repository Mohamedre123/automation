<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080a12" />
    <meta
      name="description"
      content="تدفّق - منصة أتمتة عربية: اربط واتساب وتيليجرام والسوشيال ميديا وأي API ببعض، وخلي الذكاء الاصطناعي يرد على عملاءك وينشر محتواك ويشتغل لوحده 24 ساعة."
    />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>تدفّق | منصة الأتمتة بالذكاء الاصطناعي</title>
    <script>
      // Applied before first paint so a saved light theme never flashes dark.
      try {
        if (localStorage.getItem("tadfuq_theme") === "light") document.documentElement.dataset.theme = "light";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
